<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Skivback FM</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#16071f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Skivback FM" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="style.css?v=5.1">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <main class="radio-shell">
    <aside class="station-panel">
      <div class="mini-brand">SKIVBACK <span>FM</span></div>
      <div class="panel-title">STATIONS</div>
      <nav id="station-list" class="station-list" aria-label="Radiostationer"></nav>
    </aside>

    <section class="radio-display">
      <div class="station-visual">
        <img id="station-logo" class="station-logo" src="assets/logos/blue-ark.svg" alt="Blue Ark">
        <div class="frequency-wrap"><span id="frequency">94.7</span><small>LOS SANTOS</small></div>
      </div>

      <section class="now-playing">
        <p class="label">NOW PLAYING</p>
        <h1 id="current-station">BLUE ARK</h1>
        <p id="current-track">GTA RADIO — FULL STATION</p>
        <div class="controls">
          <button id="previous" type="button" aria-label="Föregående station">◀◀</button>
          <button id="play-pause" class="primary" type="button">PLAY</button>
          <button id="next" type="button" aria-label="Nästa station">▶▶</button>
        </div>
        <div class="secondary-controls">
          <label><span>VOL</span><input id="volume" aria-label="Volym" type="range" min="0" max="100" value="70"></label>
        </div>
        <div class="share-row">
          <button id="share" class="share-button" type="button" aria-label="Dela Skivback FM" title="Dela Skivback FM">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 2.6a1.5 1.5 0 0 0-1.55-.34L3.1 8.55a1.5 1.5 0 0 0 .1 2.84l6.42 2.14 2.14 6.42a1.5 1.5 0 0 0 2.84.1L20.9 3.3a1.5 1.5 0 0 0 .5-.7ZM5.2 9.98l12.48-4.68-7.17 7.17L5.2 9.98Zm8.82 8.82-2.5-5.31 7.18-7.18-4.68 12.49Z"/></svg>
          </button>
        </div>
      </section>
    </section>
  </main>
  <div class="youtube-audio" aria-hidden="true"><div id="youtube-player"></div></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js?v=5.1"></script>
</body>
</html>
